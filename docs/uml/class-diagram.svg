<svg viewBox="0 0 1020 620" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect x="0" y="0" width="1020" height="620" fill="#FFFFFF"/>

  <!-- ===== User ===== -->
  <g>
    <rect x="30" y="30" width="240" height="220" rx="8" fill="#F6FBF4" stroke="#1B7A43" stroke-width="2"/>
    <rect x="30" y="30" width="240" height="34" rx="8" fill="#1B7A43"/>
    <rect x="30" y="52" width="240" height="12" fill="#1B7A43"/>
    <text x="150" y="53" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">User</text>
    <line x1="30" y1="64" x2="270" y2="64" stroke="#1B7A43"/>
    <text x="42" y="84" font-size="11.5" fill="#233">id : uuid</text>
    <text x="42" y="102" font-size="11.5" fill="#233">email, username : string</text>
    <text x="42" y="120" font-size="11.5" fill="#233">password : string (hash)</text>
    <text x="42" y="138" font-size="11.5" fill="#233">avatar : string?</text>
    <text x="42" y="156" font-size="11.5" fill="#233">isBot : boolean</text>
    <text x="42" y="174" font-size="11.5" fill="#233">isOnline : boolean</text>
    <text x="42" y="192" font-size="11.5" fill="#233">lastSeenAt : datetime</text>
    <text x="42" y="210" font-size="11.5" fill="#233">fcmToken : string?</text>
    <text x="42" y="228" font-size="11.5" fill="#233">createdAt : datetime</text>
  </g>

  <!-- ===== Conversation ===== -->
  <g>
    <rect x="750" y="30" width="230" height="130" rx="8" fill="#F6FBF4" stroke="#1B7A43" stroke-width="2"/>
    <rect x="750" y="30" width="230" height="34" rx="8" fill="#1B7A43"/>
    <rect x="750" y="52" width="230" height="12" fill="#1B7A43"/>
    <text x="865" y="53" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Conversation</text>
    <line x1="750" y1="64" x2="980" y2="64" stroke="#1B7A43"/>
    <text x="762" y="84" font-size="11.5" fill="#233">id : uuid</text>
    <text x="762" y="102" font-size="11.5" fill="#233">type : PRIVATE | AI</text>
    <text x="762" y="120" font-size="11.5" fill="#233">createdAt : datetime</text>
    <text x="762" y="138" font-size="11.5" fill="#233">updatedAt : datetime</text>
  </g>

  <!-- ===== ConversationParticipant (join), placée entre les deux ===== -->
  <g>
    <rect x="400" y="85" width="220" height="100" rx="8" fill="#EEF3EC" stroke="#4E6355" stroke-width="2"/>
    <rect x="400" y="85" width="220" height="30" rx="8" fill="#4E6355"/>
    <rect x="400" y="105" width="220" height="10" fill="#4E6355"/>
    <text x="510" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#FFFFFF">ConversationParticipant</text>
    <line x1="400" y1="115" x2="620" y2="115" stroke="#4E6355"/>
    <text x="412" y="133" font-size="11" fill="#233">userId : uuid (FK)</text>
    <text x="412" y="150" font-size="11" fill="#233">conversationId : uuid (FK)</text>
    <text x="412" y="167" font-size="11" fill="#233">joinedAt : datetime</text>
  </g>

  <!-- ===== Message ===== -->
  <g>
    <rect x="30" y="420" width="240" height="200" rx="8" fill="#F6FBF4" stroke="#1B7A43" stroke-width="2"/>
    <rect x="30" y="420" width="240" height="34" rx="8" fill="#1B7A43"/>
    <rect x="30" y="442" width="240" height="12" fill="#1B7A43"/>
    <text x="150" y="443" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Message</text>
    <line x1="30" y1="454" x2="270" y2="454" stroke="#1B7A43"/>
    <text x="42" y="474" font-size="11.5" fill="#233">id : uuid</text>
    <text x="42" y="492" font-size="11.5" fill="#233">content : string?</text>
    <text x="42" y="510" font-size="11.5" fill="#233">type : TEXT|IMAGE|AUDIO|FILE</text>
    <text x="42" y="528" font-size="11.5" fill="#233">mediaUrl : string?</text>
    <text x="42" y="546" font-size="11.5" fill="#233">status : SENT|DELIVERED|READ</text>
    <text x="42" y="564" font-size="11.5" fill="#233">createdAt : datetime</text>
    <text x="42" y="582" font-size="11.5" fill="#233">conversationId : uuid (FK)</text>
    <text x="42" y="600" font-size="11.5" fill="#233">senderId : uuid (FK)</text>
  </g>

  <!-- ===== Contact ===== -->
  <g>
    <rect x="750" y="440" width="230" height="150" rx="8" fill="#F6FBF4" stroke="#1B7A43" stroke-width="2"/>
    <rect x="750" y="440" width="230" height="34" rx="8" fill="#1B7A43"/>
    <rect x="750" y="462" width="230" height="12" fill="#1B7A43"/>
    <text x="865" y="463" text-anchor="middle" font-size="15" font-weight="bold" fill="#FFFFFF">Contact</text>
    <line x1="750" y1="474" x2="980" y2="474" stroke="#1B7A43"/>
    <text x="762" y="494" font-size="11.5" fill="#233">id : uuid</text>
    <text x="762" y="512" font-size="11.5" fill="#233">nickname : string?</text>
    <text x="762" y="530" font-size="11.5" fill="#233">userId : uuid (FK, propriétaire)</text>
    <text x="762" y="548" font-size="11.5" fill="#233">contactId : uuid (FK, contact)</text>
    <text x="762" y="566" font-size="11.5" fill="#233">createdAt : datetime</text>
  </g>

  <!-- ===== Relations ===== -->
  <!-- User -> ConversationParticipant (courte, directe) -->
  <path d="M270,150 L400,140" fill="none" stroke="#555" stroke-width="1.6"/>
  <text x="285" y="145" font-size="11" fill="#555">1</text>
  <text x="380" y="135" font-size="11" fill="#555">*</text>

  <!-- Conversation -> ConversationParticipant (courte, directe) -->
  <path d="M750,110 L620,130" fill="none" stroke="#555" stroke-width="1.6"/>
  <text x="725" y="105" font-size="11" fill="#555">1</text>
  <text x="635" y="125" font-size="11" fill="#555">*</text>

  <!-- User -> Message (sender), passe sous le bord gauche -->
  <path d="M130,250 C 100,320 100,370 100,420" fill="none" stroke="#555" stroke-width="1.6"/>
  <text x="120" y="290" font-size="11" fill="#555">1</text>
  <text x="105" y="412" font-size="11" fill="#555">*</text>

  <!-- Conversation -> Message : contourne largement par le bas, sous la table de jointure -->
  <path d="M810,160 C 700,320 450,420 270,480" fill="none" stroke="#555" stroke-width="1.6"/>
  <text x="770" y="185" font-size="11" fill="#555">1</text>
  <text x="290" y="478" font-size="11" fill="#555">*</text>

  <!-- User -> Contact (propriétaire), contourne par le bas -->
  <path d="M200,250 C 350,420 550,470 750,480" fill="none" stroke="#555" stroke-width="1.6"/>
  <text x="230" y="290" font-size="11" fill="#555">1 (propriétaire)</text>
  <text x="720" y="475" font-size="11" fill="#555">*</text>

  <!-- User -> Contact (contact de), contourne encore plus bas -->
  <path d="M270,220 C 450,470 600,560 750,555" fill="none" stroke="#777" stroke-width="1.6"/>
  <text x="330" y="480" font-size="11" fill="#777">1 (contact de)</text>
  <text x="720" y="565" font-size="11" fill="#777">*</text>

  <text x="510" y="612" text-anchor="middle" font-size="12" fill="#7A867D">EkoraChat — modèle de données (schéma Prisma)</text>
</svg>
