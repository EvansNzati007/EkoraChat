<svg viewBox="0 0 940 660" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#233"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="660" fill="#FFFFFF"/>

  <!-- Lifeline headers -->
  <g>
    <rect x="30" y="20" width="150" height="40" rx="6" fill="#1B7A43"/>
    <text x="105" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">App (émetteur)</text>
    <line x1="105" y1="60" x2="105" y2="610" stroke="#999" stroke-dasharray="4,3"/>
  </g>
  <g>
    <rect x="310" y="20" width="150" height="40" rx="6" fill="#1B7A43"/>
    <text x="385" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Backend</text>
    <line x1="385" y1="60" x2="385" y2="610" stroke="#999" stroke-dasharray="4,3"/>
  </g>
  <g>
    <rect x="590" y="20" width="150" height="40" rx="6" fill="#1B7A43"/>
    <text x="665" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">App (destinataire)</text>
    <line x1="665" y1="60" x2="665" y2="610" stroke="#999" stroke-dasharray="4,3"/>
  </g>
  <g>
    <rect x="800" y="20" width="120" height="40" rx="6" fill="#4E6355"/>
    <text x="860" y="45" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">Firebase (FCM)</text>
    <line x1="860" y1="60" x2="860" y2="610" stroke="#999" stroke-dasharray="4,3"/>
  </g>

  <!-- Activation bar Backend -->
  <rect x="380" y="85" width="10" height="480" fill="#DCEAE1" stroke="#1B7A43"/>

  <!-- 1. POST message -->
  <line x1="105" y1="100" x2="378" y2="100" stroke="#233" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <text x="115" y="93" font-size="11.5" fill="#233">POST /conversations/:id/messages { content }</text>

  <!-- 2. self note: DB -->
  <rect x="400" y="115" width="270" height="30" rx="5" fill="#F6FBF4" stroke="#BFD9C8"/>
  <text x="415" y="134" font-size="11" fill="#3A4A3E">Prisma → crée le Message (status = SENT)</text>

  <!-- 3. newMessage websocket to recipient (if already in room) -->
  <line x1="390" y1="175" x2="663" y2="175" stroke="#1B7A43" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#seqArrow)"/>
  <text x="400" y="168" font-size="11.5" fill="#1B7A43">newMessage (WebSocket, room "conversation:id")</text>
  <text x="400" y="192" font-size="10.5" fill="#7A867D" font-style="italic">— reçu instantanément si la conversation est déjà ouverte —</text>

  <!-- 4. self note: getRoomMemberIds -->
  <rect x="400" y="205" width="330" height="30" rx="5" fill="#F6FBF4" stroke="#BFD9C8"/>
  <text x="415" y="224" font-size="11" fill="#3A4A3E">getRoomMemberIds(conversationId) : qui a déjà la room ouverte ?</text>

  <!-- Alt frame -->
  <rect x="345" y="255" width="565" height="230" fill="none" stroke="#4E6355" stroke-width="1.6"/>
  <path d="M345,255 L400,255 L400,270 L390,280 L345,280 Z" fill="#4E6355"/>
  <text x="352" y="271" font-size="11" font-weight="bold" fill="#fff">alt</text>

  <text x="415" y="272" font-size="11" fill="#233" font-style="italic">[destinataire absent de la room → push nécessaire]</text>

  <line x1="390" y1="305" x2="855" y2="305" stroke="#233" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <text x="400" y="298" font-size="11.5" fill="#233">notifyNewMessage(fcmToken, titre, aperçu)</text>

  <line x1="855" y1="345" x2="668" y2="345" stroke="#233" stroke-width="1.6" stroke-dasharray="6,3" marker-end="url(#seqArrow)"/>
  <text x="680" y="338" font-size="11.5" fill="#233">notification (deep-link)</text>

  <line x1="345" y1="375" x2="910" y2="375" stroke="#4E6355" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="415" y="392" font-size="11" fill="#233" font-style="italic">[destinataire déjà dans la room → pas de push]</text>
  <rect x="400" y="405" width="440" height="30" rx="5" fill="#F6FBF4" stroke="#BFD9C8"/>
  <text x="415" y="424" font-size="11" fill="#3A4A3E">déjà reçu en temps réel à l'étape 3 — aucun envoi FCM</text>

  <!-- Return -->
  <line x1="378" y1="530" x2="105" y2="530" stroke="#233" stroke-width="1.6" marker-end="url(#seqArrow)"/>
  <text x="115" y="523" font-size="11.5" fill="#233">201 Created { message }</text>

  <text x="470" y="645" text-anchor="middle" font-size="12" fill="#7A867D">EkoraChat — envoi d'un message : temps réel ou notification push selon la présence</text>
</svg>
